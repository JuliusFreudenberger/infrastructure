version: '3'
services:
  postfix:
    image: boky/postfix:5.1.0:sha256@aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef
    restart: unless-stopped
    environment:
      - RELAYHOST=${RELAYHOST}
      - RELAYHOST_USERNAME=${RELAYHOST_USERNAME}
      - RELAYHOST_PASSWORD=${RELAYHOST_PASSWORD}
      - POSTFIX_smtp_tls_security_level=${POSTFIX_smtp_tls_security_level}
      - ALLOWED_SENDER_DOMAINS=${ALLOWED_SENDER_DOMAINS}
      - MASQUERADED_DOMAINS=${MASQUERADED_DOMAINS}
    networks:
      - smtp_relay

networks:
  smtp_relay:
    name: smtp_relay
