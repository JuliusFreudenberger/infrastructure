version: '3'

services:
  bitwarden:
    image: vaultwarden/server:1.37.4@sha256:19ea2b669945d842dadc3d500f2d6a795866a003330f59a47b9634658bae98bb
    restart: unless-stopped
    volumes:
      - bitwarden-data:/data
    # environment:
      # - ADMIN_TOKEN=token # set this to enable the admin ui
    networks:
      - webproxy
      - smtp_relay

volumes:
  bitwarden-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},nfsvers=4.1,soft,noatime,sync
      device: ${NFS_PATH_DATA}

networks:
  webproxy:
    external: true
    name: webproxy
  smtp_relay:
    external: true
    name: smtp_relay
