version: '3'

services:
  bitwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    restart: unless-stopped
    volumes:
      - bitwarden-data:/data
    # environment:
      # - ADMIN_TOKEN=token # set this to enable the admin ui
    networks:
      - webproxy
      - smtp_relay

volumes:
  bitwarden-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},nfsvers=4.1,soft,noatime,sync
      device: ${NFS_PATH_DATA}

networks:
  webproxy:
    external: true
    name: webproxy
  smtp_relay:
    external: true
    name: smtp_relay
