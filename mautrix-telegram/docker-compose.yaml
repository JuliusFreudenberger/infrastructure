version: "3.7"

services:
  mautrix-telegram:
    container_name: mautrix-telegram
    image: dock.mau.dev/mautrix/telegram:v26.10@sha256:ed3f3b39289fae425a875311d8875729271c24f88ba03209bd1bfbaf31e6c78f
    restart: unless-stopped
    volumes:
    - bridge_data:/data
    networks:
    - synapsenet

volumes:
  bridge_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},nfsvers=4.1,soft,noatime
      device: ${NFS_PATH_DATA}

networks:
  synapsenet:
    external: true
    name: synapsenet

